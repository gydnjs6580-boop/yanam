<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>결제 확인 | 야심한 남자</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#ffffff;--surface:#f2f4f6;--text:#191f28;--sub:#6b7684;--line:#e5e8eb;--primary:#e2483d;--primary-press:#c93b31;--primary-disabled:#f6c6c2;--err:#f04452;--ok:#1a7f37}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:16px;word-break:keep-all;min-height:100vh}
  .hide{display:none!important}
  .lg{max-width:480px;margin:0 auto;padding:0 22px calc(120px + env(safe-area-inset-bottom))}
  .lnav{height:56px}
  .icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin-top:48px}
  .icon.ok{background:#e8f5ec}.icon.warn{background:#fdecec}
  .spin{width:44px;height:44px;margin-top:58px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--text);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .title{font-size:25px;font-weight:700;line-height:1.35;letter-spacing:-.02em;margin-top:24px}
  .lead{font-size:16px;color:var(--sub);margin-top:8px}
  .lead b{color:var(--text);font-weight:600}
  .sum{margin-top:28px;border-radius:16px;background:var(--surface);padding:18px 20px}
  .sum .r{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:var(--sub)}
  .sum .r+.r{margin-top:10px}
  .sum .r b{color:var(--text);font-weight:600;text-align:right}
  .note{font-size:14px;color:var(--sub);margin-top:20px}
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:16px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,0),#fff 22px)}
  .cta .in-cta{max-width:480px;margin:0 auto;padding:0 20px}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;transition:background .15s;text-decoration:none}
  .btn:active{background:var(--primary-press)}
  .btn:disabled{background:var(--primary-disabled);cursor:default}
  .sub-btn{display:block;margin:10px auto 0;background:none;border:0;padding:8px;color:var(--sub);font-family:inherit;font-size:15px;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
</style>
</head>
<body>
<div class="lg">
  <div class="lnav"></div>

  <section id="wait">
    <div class="spin" aria-hidden="true"></div>
    <h1 class="title">결제를 확인하고 있어요</h1>
    <p class="lead">잠시만 기다려 주세요. 이 화면을 닫지 마세요.</p>
  </section>

  <section id="done" class="hide">
    <div class="icon ok"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#1a7f37" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1 class="title">결제가 완료됐어요</h1>
    <p class="lead" id="doneMsg"></p>
    <div class="sum">
      <div class="r"><span>상품</span><b>패스트트랙 (1부·2부)</b></div>
      <div class="r"><span>결제 금액</span><b id="amt">99,000원</b></div>
    </div>
  </section>

  <section id="fail" class="hide">
    <div class="icon warn"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v6" stroke="#f04452" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17" r="1.4" fill="#f04452"/></svg></div>
    <h1 class="title">결제를 확인하지 못했어요</h1>
    <p class="lead" id="failMsg"></p>
    <p class="note">결제가 끝났는데 계속 이 화면이 보이면, 결제 문자와 함께 네이버 카페 「어트랙티버」로 알려 주세요. 바로 열어 드릴게요.</p>
  </section>
</div>
<div class="cta hide" id="cta"><div class="in-cta"><button class="btn" id="go"></button><button type="button" class="sub-btn hide" id="toPay">처음부터 다시 결제하기</button></div></div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyDikW7vC9o-0FAMhvntntr0zPU2HVy_aYtXc7LqE_jA26Kvat0uEQg-gNoHl8ecbMK/exec";
const LS = "yanam_pay";
const $ = id => document.getElementById(id), qs = new URLSearchParams(location.search);
const api = body => fetch(ENDPOINT, { method: "POST", body: JSON.stringify(body) }).then(r => r.json()).catch(() => ({ ok: false, error: "인터넷 연결을 확인해 주세요." }));
const saved = (() => { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } })();
const fmt = p => String(p || "").replace(/^(\d{3})(\d{3,4})(\d{4})$/, "$1-$2-$3");
const P = { paymentKey: qs.get("paymentKey") || "", orderId: qs.get("orderId") || "", amount: Number(qs.get("amount")), phone: saved.phone || "" };
let next = null;

function view(id) { ["wait", "done", "fail"].forEach(x => $(x).classList.toggle("hide", x !== id)); $("cta").classList.toggle("hide", id === "wait"); }
function fail(msg, retry) {
  $("failMsg").textContent = msg; view("fail");
  $("go").disabled = false; $("go").textContent = retry ? "다시 확인하기" : "다시 결제하기";
  $("toPay").classList.toggle("hide", !retry);
  next = retry ? confirmPay : () => location.replace("pay.html");
}
async function confirmPay() {
  view("wait");
  if (!P.paymentKey || !P.orderId || !P.amount) return fail("결제 정보가 없어요. 결제를 다시 진행해 주세요.", false);
  if (!/^01[016789]\d{7,8}$/.test(P.phone)) return fail("휴대폰 번호 정보가 없어요. 이 결제를 시작한 기기·브라우저에서 열어 주세요.", false);
  const r = await api({ kind: "tossConfirm", paymentKey: P.paymentKey, orderId: P.orderId, amount: P.amount, phone: P.phone });
  if (!r.ok) return fail(r.error || "잠시 후 다시 시도해 주세요.", !r.final);
  localStorage.removeItem(LS);
  $("doneMsg").innerHTML = r.sms ? "<b>" + fmt(P.phone) + "</b>(으)로<br>문자로 열람 링크를 보냈어요." : "<b>" + fmt(P.phone) + "</b> 번호로<br>지금 바로 열 수 있어요.";
  $("amt").textContent = P.amount.toLocaleString("ko-KR") + "원";
  history.replaceState(null, "", "pay-done.html"); // 새로고침·뒤로가기로 다시 확인 요청이 가지 않게
  view("done"); $("go").disabled = false; $("go").textContent = "패스트트랙 열기"; $("toPay").classList.add("hide");
  next = () => location.href = "ft-read.html?from=pay";
}
$("go").onclick = () => { if ($("go").disabled || !next) return; const f = next; $("go").disabled = true; $("go").textContent = "여는 중…"; f(); }; // 다음 화면까지 버튼을 되돌리지 않음
$("toPay").onclick = () => location.replace("pay.html");

if (!P.paymentKey && !P.orderId) location.replace("ft-read.html"); // 결제 정보 없이 들어온 경우(완료 후 새로고침 등)
else confirmPay();
</script>
</body>
</html>
