<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>내 무료 자료 | 야심한 남자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--red:#e2483d;--gold:#c9973a;--ink:#111;--sub:#666;--line:#e6e8ec;--green:#2fb24c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f4f5f7;color:var(--ink);line-height:1.5;word-break:keep-all}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;text-align:center;position:sticky;top:0;z-index:5}
  .top b{font-size:16px}.top span{display:block;font-size:12px;color:var(--sub)}
  .wrap{max-width:480px;margin:0 auto;padding:14px 12px 40px}
  .hello{font-size:15px;margin:6px 4px 12px}
  .card{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;border:1px solid var(--line)}
  .main-card{border:3px solid var(--green);padding:0;overflow:hidden}
  .tagrow{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 0}
  .tag{background:var(--green);color:#fff;font-weight:700;font-size:14px;padding:6px 12px;border-radius:8px}
  .dday{background:#f1f2f4;border-radius:999px;padding:6px 12px;font-size:13.5px}
  .dday b{color:var(--red)}
  .book{text-align:center;padding:26px 16px 10px}
  .book h2{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.3}
  .book p{color:var(--sub);font-size:14px;margin-top:8px}
  .open{display:block;margin:16px 16px 6px;background:#111;color:#fff;text-align:center;text-decoration:none;font-weight:800;font-size:16px;border-radius:12px;padding:15px}
  .open.off{background:#bbb;pointer-events:none}
  .toc{list-style:none;margin:4px 16px 0;padding:0;font-size:14.5px}
  .toc li{border-top:1px solid var(--line)}
  .toc a{display:block;padding:10px 2px;color:#333;text-decoration:none}
  .copy{display:block;width:calc(100% - 32px);margin:8px 16px 16px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font:inherit;font-size:14px;cursor:pointer}
  .chs{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;padding:12px 10px 18px;font-size:14.5px}
  .chs button{border:0;background:none;font-family:inherit;font-size:14.5px;color:#333;cursor:pointer;padding:2px}
  .chs button.on{text-decoration:underline;font-weight:800}
  .chs button.lock{color:#999;cursor:default}
  .chs i{color:#ccc;font-style:normal}
  /* 쿠폰 */
  .coupon{display:flex;background:#fffaf0;border:1.5px solid #e8c98a;border-radius:16px;margin-bottom:12px;overflow:hidden}
  .coupon .l{flex:1;padding:16px}
  .coupon .r{width:120px;border-left:2px dashed #e8c98a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center}
  .gold{display:inline-block;background:#d9a54a;color:#fff;font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px}
  .coupon h3{font-size:18px;font-weight:900;margin-top:8px;letter-spacing:-.02em}
  .coupon small{display:block;color:var(--sub);font-size:12.5px;margin-top:4px}
  .coupon .lim{float:right;background:#f6ecd8;border-radius:999px;padding:2px 9px;font-size:12px}
  .coupon .lim b{color:var(--red)}
  .use{background:linear-gradient(180deg,#e6b765,#c9973a);color:#fff;text-decoration:none;font-weight:900;font-size:16px;border-radius:10px;padding:12px 16px;display:block}
  .coupon .r span{font-size:11px;color:var(--sub);margin-top:6px}
  .coupon.expired{filter:grayscale(1);opacity:.6}
  /* 성과 띠 */
  .ticker{overflow:hidden;margin:0 -12px 12px;padding:4px 0}
  .ticker .track{display:flex;gap:10px;width:max-content;animation:scroll 40s linear infinite}
  .ticker div.t{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;color:var(--red);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.04)}
  .ticker div.t em{font-style:normal;color:#999;font-size:11px;margin-left:6px}
  @keyframes scroll{to{transform:translateX(-50%)}}
  /* 예약 */
  .bk h4{font-size:15.5px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .rk{display:flex;align-items:center;gap:12px;margin:8px 0}
  .rk b{width:52px;font-weight:500;font-size:16px}
  .rk select{flex:1;border:0;background:#fdeceb;color:var(--red);font-family:inherit;font-size:15px;border-radius:10px;padding:13px;text-align:center;text-align-last:center;appearance:none}
  .bk textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:15px;height:70px;resize:none;margin-top:6px}
  .bk .go{width:100%;border:0;background:#111;color:#fff;font-family:inherit;font-size:16px;font-weight:800;border-radius:12px;padding:15px;margin-top:12px;cursor:pointer}
  .bk .go:disabled{background:#bbb}
  .hint{font-size:13px;margin-top:8px;min-height:18px;color:var(--red)}
  .hint.ok{color:var(--green)}
  .ft{display:block;text-align:center;color:#111;font-size:14px;margin-top:4px}
  .err{text-align:center;padding:60px 20px;color:var(--sub)}
  .remind h4{font-size:15px;margin-bottom:10px}
  .remind ul{list-style:none;font-size:14px;margin-bottom:12px}
  .remind li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
  .remind li.done{color:#aaa}.remind li b{font-weight:600}
  .remind .btns{display:flex;gap:8px}
  .remind .btns a,.remind .btns button{flex:1;text-align:center;font:inherit;font-size:14px;font-weight:700;padding:11px 6px;border-radius:10px;border:1px solid var(--ink);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
  .remind .btns .pri{background:var(--ink);color:#fff}
  .remind small{display:block;color:var(--sub);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="top"><b>야심한 남자</b><span>내 무료 자료</span></div>
<div class="wrap" id="app"><p class="err">불러오는 중…</p></div>

<script>
/* ===== 설정 ===== */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyDikW7vC9o-0FAMhvntntr0zPU2HVy_aYtXc7LqE_jA26Kvat0uEQg-gNoHl8ecbMK/exec";
/* 무료 E-BOOK(ebook.html) 장 목록 — 원고 목차 그대로. 한 번에 전부 공개 */
const CHAPTERS = [
  { title: "01 유튜브만 몇 년째 보고 있는 당신에게", a: "ch1" },
  { title: "02 여자 앞에서 새로운 사람이 되지 말라.", a: "ch2" },
  { title: "03 나는 나고, 여자는 따라오는 것이다.", a: "ch3" },
  { title: "04 실제 무엇이 바뀌었는가?", a: "ch4" },
  { title: "05 여자에 대한 이야기.", a: "ch5" },
  { title: "06 끌려갈 것인가? 리드할 것인가?", a: "ch6" },
];
/* 성과 띠 — [예시] 실제 수강생 결과로 교체할 것 (비우면 숨김) */
const RESULTS = [
  // 실제 수강생 결과만 넣을 것. 예: "K○○ | 4주 차 | 소개팅 3번 만에 연애 시작"
];

const $ = s => document.querySelector(s);
const id = new URLSearchParams(location.search).get("id");
const DAY = 864e5;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function track(type, target) { try { navigator.sendBeacon(ENDPOINT, new Blob([JSON.stringify({ kind: "event", type, target, src: "my", vid: id || "" })], { type: "text/plain" })); } catch (e) {} }

async function load() {
  if (!id) return $("#app").innerHTML = '<p class="err">잘못된 주소입니다.</p>';
  let d;
  try { d = await (await fetch(ENDPOINT + "?my=" + encodeURIComponent(id))).json(); } catch (e) { d = { ok: false }; }
  if (!d.ok) return $("#app").innerHTML = '<p class="err">신청 정보를 찾을 수 없어요.<br>신청 직후라면 잠시 후 다시 열어 주세요.</p>';
  track("view", "my_page");
  const now = Date.now(), left = Math.ceil((d.deadline - now) / DAY), expired = left <= 0;
  const book = "ebook.html?id=" + encodeURIComponent(id);

  let html = `<p class="hello"><b>${esc(d.name)}</b>님을 위한 자료가 준비되었습니다.</p>`;
  if (d.diag) html += `<p class="hello" style="margin-top:-6px;font-size:14px;color:#666">연애 진단 결과: <b style="color:#e2483d">${esc(d.diag)}</b></p>`;
  html += `<div class="card main-card">
    <div class="tagrow"><span class="tag">📖 전체 공개</span></div>
    <div class="book"><h2>나는 나고,<br>여자는 따라오는 것이다.</h2><p>야심한 남자 무료 E-BOOK · PART 1 연애</p></div>
    <a class="open" data-t="ebook_open" href="${book}">E-BOOK 바로 읽기</a>
    <ul class="toc">${CHAPTERS.map(c => `<li><a data-t="ebook_${c.a}" href="${book}#${c.a}">${esc(c.title)}</a></li>`).join("")}</ul>
    <button class="copy" id="copyBtn">이 페이지 링크 복사 (나중에 다시 읽기)</button></div>`;

  if (d.coupon) {
    html += `<div class="coupon ${expired ? "expired" : ""}"><div class="l"><span class="gold">GOLD</span><span class="lim">사용 기한 <b>${expired ? "종료" : "D-" + left}</b></span>
      <h3>패스트트랙 신청자 전용가</h3><small>${esc(d.coupon.price)} · 신청일부터 14일간</small></div>
      <div class="r"><a class="use" data-t="coupon" href="${expired ? "#" : esc(d.coupon.url)}" target="_blank" rel="noopener">사용하기</a><span>${expired ? "기한 종료" : "바로 결제"}</span></div></div>`;
  } else {
    html += `<div class="coupon"><div class="l"><span class="gold">NEXT</span><h3>패스트트랙</h3><small>유료 연애 가이드 · 99,000원</small></div>
      <div class="r"><a class="use" data-t="fasttrack" href="fasttrack.html?src=my">보러가기</a></div></div>`;
  }

  if (RESULTS.length) {
    const items = RESULTS.concat(RESULTS).map(t => `<div class="t">${esc(t)}</div>`).join("");
    html += `<div class="ticker"><div class="track">${items}</div></div>`;
  }

  html += `<div class="card bk"><h4>📘 E-BOOK이 마음에 들었다면</h4>
    <p style="font-size:15px;line-height:1.7;color:#333">이 책이 당신이 무엇을 우선적으로 변화시켜야 하는지 알려드리는 자료였다면, 패스트트랙은 여자와의 만남과 대화에서 그 원칙을 어떻게 구체적으로 적용할 것인지 익히기 위한 자료입니다.</p>
    <a class="go" data-t="fasttrack_bottom" href="fasttrack.html?src=my_bottom" style="display:block;text-align:center;text-decoration:none">패스트트랙 보러가기 · 99,000원</a></div>`;
  $("#app").innerHTML = html;

  try { localStorage.setItem("yanam_my", location.href); } catch (e) {}
  $("#copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); $("#copyBtn").textContent = "복사됨 ✓ 카톡 '나와의 채팅'에 붙여 두세요"; track("click", "copy_link_my"); }
    catch (e) { $("#copyBtn").textContent = location.href; }
  };

  document.querySelectorAll("[data-t]").forEach(a => a.addEventListener("click", () => track("click", a.dataset.t + "_my")));
}
load();
</script>
<script src="demo/sim.js"></script>
</body>
</html>
